<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">BUYSOR 제품 쇼케이스</title><desc id="desc">노트북, 헤드폰, 스마트폰, 전동드릴, 세탁기, 냉장고가 흰색 받침대 위에 배치된 구매 판단 대표 비주얼</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfd"/><stop offset="1" stop-color="#e9eef4"/></linearGradient>
<linearGradient id="steel" x1="0" x2="1"><stop stop-color="#d8dde3"/><stop offset=".45" stop-color="#f4f6f8"/><stop offset="1" stop-color="#a8b0ba"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1320"/><stop offset="1" stop-color="#3d4f68"/></linearGradient>
<linearGradient id="screen" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0a0f1d"/><stop offset=".5" stop-color="#183b7a"/><stop offset="1" stop-color="#6aa0ff"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#607089" flood-opacity=".18"/></filter>
</defs>
<rect width="980" height="650" fill="url(#bg)"/>
<path d="M40 82h900M40 92h900" stroke="#fff" stroke-opacity=".55"/>
<ellipse cx="560" cy="593" rx="350" ry="30" fill="#c8d1dc" opacity=".28"/>
<!-- pedestals -->
<g filter="url(#shadow)">
<rect x="250" y="350" width="260" height="190" rx="7" fill="#fafafa"/>
<rect x="485" y="405" width="180" height="135" rx="7" fill="#f7f7f7"/>
<ellipse cx="225" cy="520" rx="105" ry="30" fill="#fff"/><rect x="120" y="458" width="210" height="62" fill="#fafafa"/><ellipse cx="225" cy="458" rx="105" ry="30" fill="#fff"/>
<ellipse cx="435" cy="548" rx="72" ry="22" fill="#fff"/><rect x="363" y="498" width="144" height="50" fill="#f8f8f8"/><ellipse cx="435" cy="498" rx="72" ry="22" fill="#fff"/>
</g>
<!-- fridge -->
<g transform="translate(700 130)" filter="url(#shadow)">
<rect x="0" y="0" width="190" height="390" rx="10" fill="url(#steel)" stroke="#9aa4b0"/>
<line x1="98" y1="0" x2="98" y2="255" stroke="#798491" stroke-width="2"/><line x1="0" y1="255" x2="190" y2="255" stroke="#798491" stroke-width="2"/>
<rect x="30" y="112" width="52" height="72" rx="4" fill="#333c47"/><rect x="37" y="121" width="38" height="22" rx="3" fill="#15283c"/>
<line x1="88" y1="38" x2="88" y2="190" stroke="#66717d" stroke-width="5" stroke-linecap="round"/><line x1="108" y1="38" x2="108" y2="190" stroke="#66717d" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- washer -->
<g transform="translate(560 360)" filter="url(#shadow)">
<rect width="180" height="185" rx="8" fill="#f8fafc" stroke="#c5ccd4"/>
<rect x="14" y="17" width="76" height="14" rx="3" fill="#d8dde4"/><rect x="118" y="15" width="44" height="18" rx="3" fill="#202936"/>
<circle cx="91" cy="108" r="57" fill="#303946"/><circle cx="91" cy="108" r="43" fill="#111722" stroke="#707b8a" stroke-width="5"/><circle cx="91" cy="108" r="30" fill="#263449"/>
</g>
<!-- laptop -->
<g transform="translate(300 240)" filter="url(#shadow)">
<rect x="18" y="0" width="190" height="122" rx="8" fill="#202a38"/><rect x="26" y="8" width="174" height="106" rx="3" fill="url(#screen)"/>
<path d="M0 124h226l-24 20H24z" fill="url(#steel)"/><rect x="87" y="128" width="50" height="5" rx="2" fill="#9ba5b0"/>
</g>
<!-- drill -->
<g transform="translate(515 245)" filter="url(#shadow)">
<path d="M20 35h100c24 0 42 15 42 34s-18 34-42 34H78l-8 92H30l9-97C16 91 2 78 2 64c0-14 7-24 18-29z" fill="#2d333b"/>
<rect x="122" y="49" width="76" height="31" rx="8" fill="#1d2228"/><rect x="196" y="57" width="45" height="15" rx="5" fill="#7b858e"/>
<rect x="27" y="186" width="72" height="32" rx="8" fill="#171a1f"/><rect x="47" y="96" width="26" height="92" rx="11" fill="#242a31"/>
</g>
<!-- headphones -->
<g transform="translate(128 365)" filter="url(#shadow)">
<path d="M38 89c0-64 31-98 78-98s78 34 78 98" fill="none" stroke="#282f38" stroke-width="22" stroke-linecap="round"/>
<rect x="20" y="75" width="52" height="88" rx="24" fill="url(#dark)"/><rect x="160" y="75" width="52" height="88" rx="24" fill="url(#dark)"/>
</g>
<!-- phone -->
<g transform="translate(390 408)" filter="url(#shadow)">
<rect width="86" height="146" rx="18" fill="#626a74"/><rect x="7" y="7" width="72" height="132" rx="14" fill="#4c535c"/>
<circle cx="20" cy="22" r="8" fill="#10141a"/><circle cx="41" cy="22" r="8" fill="#10141a"/><circle cx="20" cy="43" r="8" fill="#10141a"/>
</g>
<!-- light accents -->
<path d="M60 560C170 500 200 180 500 80" fill="none" stroke="#fff" stroke-width="22" opacity=".25"/><path d="M515 0l-120 650" stroke="#fff" stroke-width="80" opacity=".12"/>
</svg>