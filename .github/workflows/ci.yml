name: BUYSOR build verification

on:
  push:
    branches:
      - main
      - preview-user-model-reports-mobile
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Archive tracked source for review and rollback
        run: git archive --format=zip --output=buysor-source.zip HEAD
      - name: Retain source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: buysor-source-${{ github.sha }}
          path: buysor-source.zip
          retention-days: 7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Regression tests
        run: node --test tests/*.test.mjs
